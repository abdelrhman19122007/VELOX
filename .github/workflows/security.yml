# Security checks (OWASP A03 / A06 / A05). Results appear in the repository's Security tab and as artifacts.
#  - CodeQL:   static analysis of the Java code (injection, path traversal, weak crypto…)
#  - SpotBugs + FindSecBugs: second static analyser; any new finding fails the build
#  - Trivy:    known vulnerabilities in dependencies (pom.xml) and misconfigurations in the Dockerfile
#  - ZAP:      baseline scan of the running API (headers, cookies, information leaks)
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, to catch new CVEs in unchanged code

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-extended
      - name: Build
        run: cd backend && chmod +x mvnw && ./mvnw -q -B -DskipTests package
      - uses: github/codeql-action/analyze@v3

  spotbugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - name: SpotBugs + FindSecBugs
        run: cd backend && chmod +x mvnw && ./mvnw -q -B compile spotbugs:check
      - name: Report
        if: always()
        run: cd backend && ./mvnw -q -B spotbugs:spotbugs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs
          path: backend/target/spotbugsXml.xml

  trivy:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and Dockerfile
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy.sarif
          skip-dirs: legacy,mobile
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the API and database
        run: docker compose --profile app up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do curl -fs http://localhost:8080/api/zones && exit 0; sleep 3; done
          docker compose logs api; exit 1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080/v3/api-docs
          cmd_options: "-a -j"
          allow_issue_writing: false
          fail_action: false
      - name: Stop
        if: always()
        run: docker compose --profile app down -v
