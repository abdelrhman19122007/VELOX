# Runs on every push and pull request: build, all tests (real PostgreSQL via Testcontainers), coverage.
# A pull request should not be merged while this is red. (Dependency scanning is added in the security week.)
name: backend

on:
  push:
    paths: ["backend/**", "database/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "database/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/target/site/jacoco
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire
          path: backend/target/surefire-reports
