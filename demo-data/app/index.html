<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- Replaced by `flutter build web --base-href /app/` -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ڤيلوكس — أكل سمنود لحد باب البيت: مطاعم حقيقية، كاش عند الاستلام، وتتبع المندوب لايف.">
  <meta name="theme-color" content="#9C3D10">

  <!-- installable on phones ("Add to Home screen") -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VELOX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ڤيلوكس — توصيل سمنود</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Branded splash while the app downloads (2-3 s on first visit); removed on the first Flutter frame. */
    html, body { margin: 0; height: 100%; background: #FFF8F5; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: #FFF8F5; font-family: 'Cairo', Tahoma, 'Segoe UI', sans-serif; color: #231914; z-index: 1;
      transition: opacity .35s ease; }
    #splash img { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 10px 30px rgba(156, 61, 16, .18);
      animation: velox-pop .9s ease-out both; }
    #splash .t { font-size: 22px; font-weight: 800; letter-spacing: .5px; }
    #splash .s { font-size: 14px; color: #6B5A52; margin-top: -8px; }
    #splash .bar { width: 120px; height: 4px; border-radius: 4px; background: #F1DFD8; overflow: hidden; }
    #splash .bar i { display: block; height: 100%; width: 40%; border-radius: 4px; background: #9C3D10;
      animation: velox-run 1.1s ease-in-out infinite; }
    @keyframes velox-pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes velox-run { 0% { transform: translateX(160%); } 100% { transform: translateX(-260%); } }
    @media (prefers-reduced-motion: reduce) { #splash img, #splash .bar i { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="ڤيلوكس بيحمّل">
    <img src="icons/Icon-192.png" alt="">
    <div class="t">ڤيلوكس</div>
    <div class="s">طلباتك من قلب سمنود لحد باب بيتك</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
