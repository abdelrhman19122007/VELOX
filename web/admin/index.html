<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة تحكم ڤيلوكس</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/img/velox-icon.png" type="image/png">
</head>
<body>
  <!-- sign in -->
  <section id="login" class="center-page hidden">
    <form class="card login" id="login-form">
      <div class="brand"><img class="logo-img" src="/img/velox-logo.png" alt="VELOX" style="height:46px;width:auto;display:block"></div>
      <h1>لوحة التحكم</h1>
      <p class="muted">للإدارة وأصحاب المحلات</p>
      <label for="email">الإيميل</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">كلمة السر</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="btn" style="width:100%;margin-top:18px" type="submit">دخول</button>
      <p class="muted small">نسيت كلمة السر؟ الإدارة تقدر تديك كلمة سر مؤقتة.</p>
    </form>
  </section>

  <!-- dashboard -->
  <div id="app" class="shell hidden">
    <aside class="side" id="side">
      <div class="brand"><img class="logo-img" src="/img/velox-logo.png" alt="VELOX" style="height:46px;width:auto;display:block"></div>
      <nav class="nav" id="nav"></nav>
      <div style="margin-top:20px;padding:0 8px">
        <div class="small muted" id="who"></div>
        <button class="btn outline sm" id="theme" style="margin-top:10px">🌓 الوضع الليلي</button>
        <button class="btn ghost sm" id="logout" style="margin-top:6px">تسجيل الخروج</button>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="row" style="flex:0 1 auto">
          <button class="btn outline sm menu-btn" id="menu-btn" aria-label="القائمة">☰</button>
          <h1 id="title" style="margin:0"></h1>
        </div>
        <div id="actions" class="row" style="flex:0 1 auto"></div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
