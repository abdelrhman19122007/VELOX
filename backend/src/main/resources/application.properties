spring.application.name=velox
server.port=${PORT:8080}
server.compression.enabled=true
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never
spring.jackson.default-property-inclusion=non_null

# Database — PostgreSQL (docker compose up -d). On a server set DB_URL / DB_USER / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/velox}
spring.datasource.username=${DB_USER:velox}
spring.datasource.password=${DB_PASSWORD:velox}
spring.flyway.enabled=true

# Signs session tokens. Required in production (at least 32 random characters).
velox.security.token-secret=${VELOX_TOKEN_SECRET:}
# Web origins allowed to call the API (comma separated)
velox.security.cors-origins=${VELOX_CORS:http://localhost:*,http://127.0.0.1:*}
# First admin account, created on start-up only when both are set
velox.bootstrap.admin-email=${VELOX_ADMIN_EMAIL:}
velox.bootstrap.admin-password=${VELOX_ADMIN_PASSWORD:}
