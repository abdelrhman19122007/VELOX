name: velox_mobile
description: VELOX - ultra-fast multi-vertical delivery app (Dining, Fashion, Electronics). Kinetic Obsidian UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  google_fonts: ^6.2.1
  geolocator: ^13.0.2
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/products/
    - assets/images/stores/
    - assets/images/velox-logo.jpeg