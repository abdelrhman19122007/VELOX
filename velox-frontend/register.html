<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELOX — إنشاء حساب</title>

  <script>
    (function () {
      var theme = localStorage.getItem('velox_theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var lang = localStorage.getItem('velox_lang') || 'ar';
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    })();
  </script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-shell">
    <aside class="auth-brand">
      <div class="auth-brand-top">
        <div class="auth-logo">
          <img src="assets/images/velox-logo.jpeg" alt="VELOX">
          <div>
            <div class="auth-logo-name">VELOX</div>
            <div class="auth-logo-tagline" data-i18n="app.tagline">كل شيء يوصلك في مكان واحد</div>
          </div>
        </div>
      </div>

      <div class="auth-brand-mid">
        <h1 data-i18n="brand.headline">توصيل أسرع لكل ما تحتاجه</h1>
        <p data-i18n="brand.subline">أكل، أزياء، وإلكترونيات من متاجر موثوقة، توصيل حتى بابك في المحافظات الأربع.</p>
      </div>

      <div class="auth-brand-stats">
        <div><strong data-i18n="brand.stat1.value">٣</strong><span data-i18n="brand.stat1.label">فئات منتجات</span></div>
        <div><strong data-i18n="brand.stat2.value">٧</strong><span data-i18n="brand.stat2.label">متاجر شريكة</span></div>
        <div><strong data-i18n="brand.stat3.value">٤</strong><span data-i18n="brand.stat3.label">محافظات مغطاة</span></div>
      </div>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-card">
        <div class="auth-topbar">
          <button type="button" id="theme-toggle" class="icon-toggle" data-i18n-aria-label="nav.toggleTheme" aria-label="Toggle dark mode"></button>
          <button type="button" id="lang-toggle" class="icon-toggle" style="width:auto; padding-inline:12px; font-weight:700; font-size:13px;" data-i18n="nav.toggleLang">English</button>
        </div>

        <div class="auth-card-header">
          <h2 data-i18n="register.title">إنشاء حساب جديد</h2>
          <p data-i18n="register.subtitle">انضم إلى VELOX وابدأ الطلب في دقائق.</p>
        </div>

        <div id="register-alert" aria-live="polite"></div>

        <form id="register-form" novalidate>
          <div class="field" id="field-fullname">
            <label for="fullname" data-i18n="form.fullName.label">الاسم الكامل</label>
            <input type="text" id="fullname" name="fullname" autocomplete="name" data-i18n-placeholder="form.fullName.placeholder" placeholder="مثال: هدى ياسر">
            <div class="field-hint"></div>
          </div>

          <div class="field" id="field-email">
            <label for="email" data-i18n="form.email.label">البريد الإلكتروني</label>
            <input type="email" id="email" name="email" autocomplete="email" data-i18n-placeholder="form.email.placeholder" placeholder="name@example.com">
            <div class="field-hint"></div>
          </div>

          <div class="form-grid-2">
            <div class="field" id="field-phone">
              <label for="phone" data-i18n="form.phone.label">رقم الهاتف</label>
              <input type="tel" id="phone" name="phone" autocomplete="tel" data-i18n-placeholder="form.phone.placeholder" placeholder="01xxxxxxxxx">
              <div class="field-hint"></div>
            </div>

            <div class="field" id="field-governorate">
              <label for="governorate" data-i18n="form.governorate.label">المحافظة</label>
              <select id="governorate" name="governorate">
                <option value="" selected disabled></option>
                <option value="CAIRO" data-i18n="form.governorate.CAIRO">القاهرة</option>
                <option value="GIZA" data-i18n="form.governorate.GIZA">الجيزة</option>
                <option value="ALEXANDRIA" data-i18n="form.governorate.ALEXANDRIA">الإسكندرية</option>
                <option value="DAMIETTA" data-i18n="form.governorate.DAMIETTA">دمياط</option>
                <option value="BEHEIRA" data-i18n="form.governorate.BEHEIRA">البحيرة</option>
                <option value="KAFR_EL_SHEIKH" data-i18n="form.governorate.KAFR_EL_SHEIKH">كفر الشيخ</option>
                <option value="GHARBIA" data-i18n="form.governorate.GHARBIA">الغربية</option>
                <option value="MENOFIA" data-i18n="form.governorate.MENOFIA">المنوفية</option>
                <option value="QALYUBIA" data-i18n="form.governorate.QALYUBIA">القليوبية</option>
                <option value="SHARKIA" data-i18n="form.governorate.SHARKIA">الشرقية</option>
                <option value="DAKAHLIA" data-i18n="form.governorate.DAKAHLIA">الدقهلية</option>
                <option value="PORT_SAID" data-i18n="form.governorate.PORT_SAID">بورسعيد</option>
                <option value="ISMAILIA" data-i18n="form.governorate.ISMAILIA">الإسماعيلية</option>
                <option value="SUEZ" data-i18n="form.governorate.SUEZ">السويس</option>
                <option value="NORTH_SINAI" data-i18n="form.governorate.NORTH_SINAI">شمال سيناء</option>
                <option value="SOUTH_SINAI" data-i18n="form.governorate.SOUTH_SINAI">جنوب سيناء</option>
                <option value="FAYOUM" data-i18n="form.governorate.FAYOUM">الفيوم</option>
                <option value="BENI_SUEF" data-i18n="form.governorate.BENI_SUEF">بني سويف</option>
                <option value="MINYA" data-i18n="form.governorate.MINYA">المنيا</option>
                <option value="ASYUT" data-i18n="form.governorate.ASYUT">أسيوط</option>
                <option value="SOHAG" data-i18n="form.governorate.SOHAG">سوهاج</option>
                <option value="QENA" data-i18n="form.governorate.QENA">قنا</option>
                <option value="LUXOR" data-i18n="form.governorate.LUXOR">الأقصر</option>
                <option value="ASWAN" data-i18n="form.governorate.ASWAN">أسوان</option>
                <option value="NEW_VALLEY" data-i18n="form.governorate.NEW_VALLEY">الوادي الجديد</option>
                <option value="MATROUH" data-i18n="form.governorate.MATROUH">مطروح</option>
                <option value="RED_SEA" data-i18n="form.governorate.RED_SEA">البحر الأحمر</option>
              </select>
              <div class="field-hint"></div>
            </div>
          </div>

          <div class="field" id="field-password">
            <label for="password" data-i18n="form.password.label">كلمة المرور</label>
            <div class="input-wrap">
              <input type="password" id="password" name="password" autocomplete="new-password" data-i18n-placeholder="form.password.placeholder" placeholder="••••••••">
              <button type="button" id="password-toggle" class="input-icon-btn" data-i18n-aria-label="form.password.show" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="strength-meter" id="strength-meter" data-level="0">
              <span></span><span></span><span></span><span></span>
            </div>
            <div class="field-hint" id="strength-label"></div>
          </div>

          <div class="field" id="field-confirm-password">
            <label for="confirm-password" data-i18n="form.confirmPassword.label">تأكيد كلمة المرور</label>
            <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" data-i18n-placeholder="form.password.placeholder" placeholder="••••••••">
            <div class="field-hint"></div>
          </div>

          <button type="submit" id="register-submit" class="btn btn-primary btn-block">
            <span class="spinner"></span>
            <span class="btn-label" data-i18n="register.submit">إنشاء الحساب</span>
          </button>
        </form>

        <p class="auth-footer-note">
          <span data-i18n="register.haveAccount">لديك حساب بالفعل؟</span>
          <a href="login.html" data-i18n="register.loginLink">تسجيل الدخول</a>
        </p>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/navControls.js"></script>
  <script src="js/utils/validation.js"></script>
  <script src="js/utils/domUtils.js"></script>
  <script src="js/services/apiClient.js"></script>
  <script src="js/services/authService.js"></script>
  <script src="js/pages/registerPage.js"></script>
</body>
</html>
